version: 2

builds:
  - id: deal-kit
    main: ./cmd/deal-kit
    binary: deal-kit
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# Ship bare binaries, not archives: install.sh downloads one file directly.
archives:
  - formats: [binary]
    name_template: "deal-kit_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: auto
