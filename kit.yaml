# Manifest of everything deal-kit can install.
#
# Artifact IDs are hierarchical for organisation inside this repository.
# Skills are FLATTENED on install, because agents discover skills in a flat
# namespace (.claude/skills/<name>/SKILL.md): `web/ui` is written as `web-ui`,
# which must match the `name` in its SKILL.md frontmatter.
#
# Destinations resolve against the CRM DEAL folder structure. `deal-kit init`
# detects the project type and records the roots in deal-kit.lock.

version: 1

# CRM DEAL is a polyrepo: one repository per project, three project types.
project_types:
  backend:
    match: "crm-deal-*-service"   # NestJS, hexagonal
    roots:
      src: src
      modules: src/modules
  web:
    match: "crm-deal-web"          # React + Vite, feature-based
    roots:
      src: src
      ui: src/shared/ui            # design system (shadcn catalog)
      hooks: src/shared/hooks
      features: src/features
  mobile:
    match: "crm-deal-mobile"       # React Native + Expo, React Native Paper
    roots:
      src: src
      features: src/features

# The kit authors components against its own layout (@/components/ui, @/lib).
# Projects put them somewhere else, so imports are rewritten on install.
# Longest prefix wins, so a more specific rule can precede a general one.
import_rewrites:
  web:
    "@/components/ui/": "@/shared/ui/"
    "@/hooks/": "@/shared/hooks/"
    "@/lib/": "@/shared/lib/"

# What `deal-kit init` installs for each project type.
profiles:
  backend: [general/conventions, general/pr-workflow, backend/architecture, backend/connections]
  web:     [general/conventions, general/pr-workflow, web/architecture, web/ui, ui-kit/base, ui-kit/theme]
  mobile:  [general/conventions, general/pr-workflow, mobile/architecture, mobile/offline]

artifacts:
  # ---- skills ----
  - { id: general/conventions,  type: skill, applies_to: [backend, web, mobile], src: skills/general/conventions }
  - { id: general/pr-workflow,  type: skill, applies_to: [backend, web, mobile], src: skills/general/pr-workflow }
  - { id: backend/architecture, type: skill, applies_to: [backend], src: skills/backend/architecture }
  - { id: backend/connections,  type: skill, applies_to: [backend], src: skills/backend/connections }
  - { id: web/architecture,     type: skill, applies_to: [web],     src: skills/web/architecture }
  - { id: web/ui,               type: skill, applies_to: [web],     src: skills/web/ui }
  - { id: mobile/architecture,  type: skill, applies_to: [mobile],  src: skills/mobile/architecture }
  - { id: mobile/offline,       type: skill, applies_to: [mobile],  src: skills/mobile/offline }

  # ---- ui-kit (web only: mobile uses React Native Paper) ----
  # Generated from the components' own imports: `requires` mirrors
  # `@/components/ui/...` imports, `npm` mirrors external ones.

  - id: ui-kit/base
    type: component
    applies_to: [web]
    src: ui-kit/lib
    dest: "{src}/shared/lib"
    npm:
      clsx: "^2.1.1"
      tailwind-merge: "^3.5.0"

  - id: ui-kit/use-mobile
    type: component
    applies_to: [web]
    src: ui-kit/hooks/use-mobile.ts
    dest: "{hooks}/use-mobile.ts"

  - id: ui-kit/theme
