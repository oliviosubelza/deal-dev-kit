    applies_to: [web]
    src: ui-kit/theme.css
    dest: "{src}/theme.css"

  - id: ui-kit/accordion
    type: component
    applies_to: [web]
    src: ui-kit/components/ui/accordion.tsx
    dest: "{ui}/accordion.tsx"
    requires: [ui-kit/base]
    npm:
      lucide-react: "^1.8.0"
      radix-ui: "^1.4.3"

  - id: ui-kit/alert-dialog
    type: component
    applies_to: [web]
    src: ui-kit/components/ui/alert-dialog.tsx
    dest: "{ui}/alert-dialog.tsx"
    requires: [ui-kit/base, ui-kit/button, ui-kit/portal-container]
    npm:
      radix-ui: "^1.4.3"

  - id: ui-kit/alert
