name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tool/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: shellcheck scripts/install.sh

      # Catch a broken release config on the pull request rather than at tag
      # time, when a failure blocks a release everyone is waiting for.
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check
          workdir: tool

  # The ui-kit is distributed by copying source files, so nothing ever compiled
  # it. This job is the only thing that does.
  ui-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-kit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
